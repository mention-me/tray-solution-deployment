name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]

permissions:
  contents: read

jobs:
  update_release:
    name: Prepare
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      pull-requests: read
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: release-drafter/release-drafter@v7

  autolabel:
    name: Autolabel
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7

  check_labels:
    name: Validate Labels
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: autolabel
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: mheap/github-action-required-labels@v5
        if: ${{ always() }}
        with:
          mode: exactly
          count: 1
          labels: "bump-patch, bump-minor, bump-major, skip-changelog"
          add_comment: true
          message: |
            This PR needs **{{ errorString }}** one label added to indicate whether it is a major, minor, or patch change.

            The available labels are: `bump-patch`, `bump-minor`, `bump-major` and `skip-changelog`.

      - uses: mheap/github-action-required-labels@v5
        if: ${{ always() }}
        with:
          mode: exactly
          count: 1
          labels: "feature, chore, bug"
          add_comment: true
          message: |
            This PR needs **{{ errorString }}** one label added to indicate whether it is a feature, bug, or chore.

            The available labels are: `feature`, `chore`, `bug`.
